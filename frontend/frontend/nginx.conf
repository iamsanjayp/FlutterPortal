server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # For HTTPS in production, use:
  # listen 443 ssl http2;
  # ssl_certificate /path/to/ssl/cert.pem;
  # ssl_certificate_key /path/to/ssl/key.pem;

  # Gzip compression for CSS, JS, JSON
  gzip on;
  gzip_types text/plain text/css text/javascript application/javascript application/json;
  gzip_min_length 1024;
  gzip_vary on;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # API endpoints (proxy to backend) under /flutter
  location /flutter/api/ {
    proxy_pass http://mobiledev-backend:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /flutter/auth/ {
    proxy_pass http://mobiledev-backend:5000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /flutter/uploads/ {
    proxy_pass http://mobiledev-backend:5000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Compatibility for previews generated before the /flutter base path fix
  location /uploads/ {
    proxy_pass http://mobiledev-backend:5000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Static assets under /flutter/
  location /flutter/assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location /flutter/ {
    rewrite ^/flutter(/.*)$ $1 break;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /flutter {
    return 301 /flutter/;
  }
}
