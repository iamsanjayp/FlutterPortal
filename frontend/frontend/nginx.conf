server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gzip compression for CSS, JS, JSON, WASM, Fonts
  gzip on;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm font/otf font/ttf image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # ==========================================
  # 1. API Endpoints (Both /flutter/api/ and /api/)
  # ==========================================
  location ^~ /flutter/api/ {
    proxy_pass http://mobiledev-backend:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
  }

  location ^~ /api/ {
    proxy_pass http://mobiledev-backend:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ==========================================
  # 2. Auth Endpoints (Both /flutter/auth/ and /auth/)
  # ==========================================
  location ^~ /flutter/auth/ {
    proxy_pass http://mobiledev-backend:5000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
  }

  location ^~ /auth/ {
    proxy_pass http://mobiledev-backend:5000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ==========================================
  # 3. Uploads & UI Previews (Both /flutter/uploads/ and /uploads/)
  # ^~ modifier prevents static regex from hijacking Flutter .js/.wasm/.css assets
  # ==========================================
  location ^~ /flutter/uploads/ {
    proxy_pass http://mobiledev-backend:5000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    add_header Access-Control-Allow-Origin * always;
  }

  location ^~ /uploads/ {
    proxy_pass http://mobiledev-backend:5000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    add_header Access-Control-Allow-Origin * always;
  }

  # ==========================================
  # 4. Built Frontend Static Assets
  # ==========================================
  location ^~ /flutter/assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location ^~ /assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # Cache static assets by file extension
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # ==========================================
  # 5. SPA Routing for /flutter/ and /
  # ==========================================
  location /flutter/ {
    rewrite ^/flutter(/.*)$ $1 break;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /flutter {
    return 301 /flutter/;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
