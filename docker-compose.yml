services:
  mysql:
    image: mysql:8.0
    container_name: mobiledev-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mobiledev_portal
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Kolkata
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  flutter-runner:
    image: pcdpbit/flutter-runner:${IMG_TAG}

  backend:
    image: pcdpbit/mobiledev-backend:${IMG_TAG}
    container_name: mobiledev-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - flutter-runner
    environment:
      PORT: 5000
      DB_HOST: ${MYSQL_HOST}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: mobiledev_portal
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Kolkata
      FLUTTER_RUNNER_IMAGE: pcdpbit/flutter-runner:${IMG_TAG}
      PUBLIC_APP_BASE_PATH: /flutter
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
      JWT_COOKIE_MAX_AGE_MS: ${JWT_COOKIE_MAX_AGE_MS}
      NODE_ENV: production
      FRONTEND_URL: "https://pcdp.bitsathy.ac.in/flutter"
      FRONTEND_URLS: "https://pcdp.bitsathy.ac.in/flutter"
      RESET_SESSION_SECRET: ${RESET_SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
    ports:
      - "5004:5000"  # Backend: host 5003 -> container 5000
    volumes:
      - /opt/uploads/flutter:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    image: pcdpbit/mobiledev-frontend:${IMG_TAG}
    container_name: mobiledev-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8084:80"  # Frontend: host 8083 -> container 80

volumes:
  mysql_data: