name: ui_solution
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  flutter_riverpod: ^2.5.1
  flutter_bloc: ^8.1.3
  dio: ^5.4.0
  http: ^1.1.0
  sqflite_common_ffi_web: ^0.4.3
  shared_preferences: ^2.2.2
  get_it: ^7.6.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
 
flutter:
  uses-material-design: true
  # Custom fonts for rendering
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
  
